publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

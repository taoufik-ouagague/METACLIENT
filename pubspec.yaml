name: metaclient
description: "Application mobile METACLIENT - Suivi transport et messagerie en temps réel"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  logger: ^2.0.2
  image_picker: ^1.2.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/img/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/img/app_icon.png"
  macos:
    generate: true
    image_path: "assets/img/app_icon.png"

